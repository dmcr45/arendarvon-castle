<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1112 736" width="1112" height="736">
<style>
:root{--paper:#F6F4EE;--ink:#1E242B;--dim:#76808A;--grid:#E6E2D8;--room:#FFFDF8;--dark:#EAE5D9;--scores:#FBF6E4;--accent:#1F5C8B;--accent2:#7A5B16;--magic:#7B3FA0;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#141A20;--ink:#DEE4EA;--dim:#8B97A2;--grid:#1F272F;--room:#1C242C;--dark:#161D24;--scores:#222A26;--accent:#7FB1DC;--accent2:#D9B36A;--magic:#C08BE0;}}
:root[data-theme="dark"]{--paper:#141A20;--ink:#DEE4EA;--dim:#8B97A2;--grid:#1F272F;--room:#1C242C;--dark:#161D24;--scores:#222A26;--accent:#7FB1DC;--accent2:#D9B36A;--magic:#C08BE0;}
text{font-family:"Segoe UI",system-ui,sans-serif}
.grid{stroke:var(--grid);stroke-width:.5}
.foot{stroke:var(--dim);stroke-width:1.1;opacity:.5}
.footfill{fill:var(--dim);opacity:.09}
.room{fill:var(--room);stroke:var(--ink);stroke-width:1.6}
.dark{fill:var(--dark)}.scores{fill:var(--scores)}
.gap{stroke:var(--paper);stroke-width:4.6;stroke-linecap:butt}
.door{stroke:var(--ink);stroke-width:1.5;fill:none}
.shut{fill:var(--ink)}
.hid{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:2.6 2.6;fill:none}
.magic{stroke:var(--magic);stroke-width:2.6;fill:none}
.oneway{fill:var(--accent)}
.rname{font-size:10px;font-weight:600;fill:var(--ink);text-anchor:middle}
.rnum{font-family:"Cascadia Mono",Consolas,monospace;font-size:8px;fill:var(--dim)}
.item{font-size:8.5px;fill:var(--accent2);text-anchor:middle}
.who{font-size:9px;font-style:italic;fill:var(--accent);text-anchor:middle}
.up{font-family:"Cascadia Mono",Consolas,monospace;font-size:8px;fill:var(--dim);text-anchor:middle}
.h1{font-size:19px;font-weight:600;fill:var(--ink)}
.sub{font-size:11px;fill:var(--dim)}
.keyh{font-size:11px;font-weight:600;fill:var(--ink)}
.key{font-size:10px;fill:var(--ink)}
.keydim{font-size:10px;fill:var(--dim)}
</style>
<defs><pattern id="steps" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--room)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--dim)" stroke-width="1.3"/></pattern></defs>
<rect width="1112" height="736" fill="var(--paper)"/>
